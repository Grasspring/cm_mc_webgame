<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫學習選擇題遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .setup-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 14px;
            min-width: 0; /* 允許縮小 */
            line-height: 1.2;
        }

        .checkbox-item:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 6px;
            margin-top: 0;
            margin-bottom: 0;
            transform: scale(1.1);
            vertical-align: middle;
            flex-shrink: 0;
        }

        .checkbox-item label {
            margin: 0;
            line-height: 1.2;
            vertical-align: middle;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"]:checked + label {
            color: #667eea;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .difficulty-description {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .difficulty-description small {
            color: #6c757d;
            font-size: 13px;
            line-height: 1.4;
        }

        .category-filter-panel {
            border: 2px solid #dfe6ff;
            border-radius: 10px;
            background: #f8f9ff;
            overflow: hidden;
        }

        .category-filter-panel summary {
            padding: 12px 14px;
            cursor: pointer;
            font-weight: bold;
            color: #4156a8;
            user-select: none;
            background: #eef2ff;
        }

        .category-filter-panel[open] summary {
            border-bottom: 1px solid #dfe6ff;
        }

        .category-filter-actions {
            display: flex;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid #e3e8ff;
            flex-wrap: wrap;
        }

        .mini-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .mini-btn:hover {
            background: #5a6fd6;
        }

        .category-filter-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding: 12px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: white;
            border: 1px solid #e2e7ff;
            border-radius: 6px;
            font-size: 14px;
        }

        .category-item input[type="checkbox"] {
            transform: scale(1.1);
            flex-shrink: 0;
        }

        .category-filter-status {
            margin-top: 8px;
            color: #555;
            font-size: 13px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* 開始測驗按鈕特殊樣式 */
        .start-quiz-button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 30px auto 20px auto;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }

        .start-quiz-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(40, 167, 69, 0.4);
            background: linear-gradient(135deg, #218838 0%, #1ea080 100%);
        }

        .start-quiz-button:active {
            transform: translateY(-1px);
        }

        /* 其他按鈕區域 */
        .other-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .quiz-section {
            display: none;
        }

        .question-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.4em;
            line-height: 1.8;
            white-space: pre-line;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 300px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
        }

        .question-text:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .question-text.expanded {
            max-height: none;
        }

        .question-text.has-overflow:not(.expanded)::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        .question-text.has-overflow::after {
            content: "📖 點擊展開完整內容";
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .question-text.has-overflow.expanded::after {
            content: "📚 點擊收合內容";
        }

        .question-text.has-overflow:hover::after {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            transform: scale(1.05);
        }

        /* 當沒有溢出時，移除cursor pointer */
        .question-text:not(.has-overflow) {
            cursor: default;
        }

        .answer-options {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-option {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            white-space: pre-line;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .answer-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .answer-option.selected {
            border-color: #667eea;
            background: #e6f0ff;
        }

        .answer-option.correct {
            border-color: #28a745;
            background: #d4edda;
            color: #155724;
        }

        .answer-option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }

        .question-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-display {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.6;
        }

        .result-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .final-score {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-top: 20px;
        }

        .final-score h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .final-score .score {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }

        .statistics-report {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .statistics-report h3 {
            color: white;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        .stats-details {
            display: none;
            margin-top: 20px;
        }

        .stats-details.show {
            display: block;
        }

        .question-result {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .question-result.correct {
            border-left-color: #28a745;
        }

        .question-result.incorrect {
            border-left-color: #dc3545;
        }

        .question-result-header {
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
        }

        .question-result-content {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        .user-answer, .correct-answer {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .user-answer.correct {
            background: rgba(40, 167, 69, 0.2);
        }

        .user-answer.incorrect {
            background: rgba(220, 53, 69, 0.2);
        }

        .correct-answer {
            background: rgba(40, 167, 69, 0.2);
        }

        .final-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stats-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .history-stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .history-stats-table th,
        .history-stats-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .history-stats-table th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        .history-stats-table tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .accuracy-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            position: relative;
            min-width: 100px;
        }

        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc3545 0%, #ffc107 50%, #28a745 100%);
            transition: width 0.3s ease;
        }

        .accuracy-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .no-stats-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            font-size: 1.1em;
        }

        .hidden {
            display: none !important;
        }

        .show-history {
            display: block !important;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .main-content {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .checkbox-item {
                padding: 6px 8px;
                font-size: 13px;
            }

            .category-filter-list {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            
            .start-quiz-button {
                padding: 16px 30px;
                font-size: 18px;
                margin: 25px auto 15px auto;
            }
            
            .other-buttons {
                gap: 10px;
            }
            
            .other-buttons .btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>中醫學習選擇題遊戲</h1>
            <p>即便現在你仍需學習，但在病人眼中你就是醫生。</p>
        </div>

        <div class="main-content">
            <!-- 遊戲設定區域 -->
            <div id="setupSection" class="setup-section">
                <div class="section-title">📚 科目選擇</div>
                <div class="form-group">
                    <label for="subjectSelect">選擇學習科目：</label>
                    <select id="subjectSelect">
                        <option value="">請選擇科目...</option>
                    </select>
                </div>

                <div class="section-title">🏷️ 題目分類</div>
                <div class="form-group">
                    <label>病名篩選（預設全選）：</label>
                    <details class="category-filter-panel">
                        <summary>點擊展開 / 收合病名清單</summary>
                        <div class="category-filter-actions">
                            <button type="button" class="mini-btn" onclick="selectAllDiseases()">全選</button>
                            <button type="button" class="mini-btn" onclick="unselectAllDiseases()">全部取消</button>
                        </div>
                        <div id="diseaseFilterList" class="category-filter-list"></div>
                    </details>
                    <div id="diseaseFilterStatus" class="category-filter-status">請先選擇科目以載入病名清單</div>
                </div>

                <div class="section-title">❓ 題型設定</div>
                <div class="form-group">
                    <label>問題將提供什麼資訊：</label>
                    <div class="checkbox-group" id="questionInfo">
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-病名" value="病名" checked>
                            <label for="info-病名">病名</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-證型" value="證型" checked>
                            <label for="info-證型">證型</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-治法" value="治法">
                            <label for="info-治法">治法</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-方藥" value="方藥">
                            <label for="info-方藥">方藥</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-證候" value="證候" checked>
                            <label for="info-證候">證候</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-系列" value="系列">
                            <label for="info-系列">系列</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-組成" value="組成">
                            <label for="info-組成">組成</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>答案組合的資料：</label>
                    <div class="checkbox-group" id="answerInfo">
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-病名" value="病名">
                            <label for="ans-病名">病名</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-證型" value="證型">
                            <label for="ans-證型">證型</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-治法" value="治法" checked>
                            <label for="ans-治法">治法</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-方藥" value="方藥" checked>
                            <label for="ans-方藥">方藥</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-證候" value="證候">
                            <label for="ans-證候">證候</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-系列" value="系列">
                            <label for="ans-系列">系列</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-組成" value="組成">
                            <label for="ans-組成">組成</label>
                        </div>
                    </div>
                </div>

                <div class="section-title">⚙️ 遊戲設定</div>
                <div class="form-group">
                    <label for="optionCount">答案選項數量：</label>
                    <select id="optionCount">
                        <option value="2">2項</option>
                        <option value="3">3項</option>
                        <option value="4" selected>4項</option>
                        <option value="5">5項</option>
                        <option value="6">6項</option>
                        <option value="7">7項</option>
                        <option value="8">8項</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="forceNoneOption">
                        <label for="forceNoneOption">加入「以上皆非」選項</label>
                    </div>
                    <div class="difficulty-description">
                        <small>啟用後：固定在最後多一項「以上皆非」；且每題會隨機出現「以上皆非」為正確答案的情況。</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="questionCount">問題數量：</label>
                    <select id="questionCount">
                        <option value="10" selected>10題</option>
                        <option value="20">20題</option>
                        <option value="30">30題</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficultyMode">難度設定：</label>
                    <select id="difficultyMode">
                        <option value="normal">一般模式（隨機答案）</option>
                        <option value="hard">困難模式（同病名答案）</option>
                    </select>
                    <div class="difficulty-description">
                        <small>
                            <span id="difficultyDesc">一般模式：錯誤答案從所有資料中隨機選取</span>
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="followUpMode">追問模式：</label>
                    <select id="followUpMode">
                        <option value="none" selected>不啟用追問</option>
                        <option value="formula-composition">追問方藥的組成</option>
                        <option value="formula-series">追問方藥的系列（只顯示第一方藥）</option>
                        <option value="same-disease-syndrome">追問同病名的另一個證型</option>
                    </select>
                    <div class="difficulty-description">
                        <small>

    <script src="encrypted_datasets.js"></script>

    <script>
        async function loadDatasetFiles() {
            console.log('載入加密數據集科目列表...');

            try {
                if (typeof ENCRYPTED_DATASETS === 'undefined' || !ENCRYPTED_DATASETS) {
                    throw new Error('加密數據集未載入');
                }

                const subjects = Object.keys(ENCRYPTED_DATASETS);
                if (subjects.length === 0) {
                    throw new Error('加密數據集沒有任何科目');
                }

                const select = document.getElementById('subjectSelect');
                select.innerHTML = '<option value="">請選擇科目...</option>';

                subjects.forEach(subjectKey => {
                    const option = document.createElement('option');
                    option.value = subjectKey;
                    option.textContent = subjectKey.includes('_')
                        ? subjectKey.split('_').slice(1).join('_')
                        : subjectKey;
                    select.appendChild(option);
                });

                select.value = subjects[0];
                console.log('科目選項已載入完成:', subjects);

            } catch (error) {
                console.error('載入加密科目列表失敗，使用備援科目:', error);
                const select = document.getElementById('subjectSelect');
                select.innerHTML = `
                    <option value="">請選擇科目...</option>
                    <option value="01_內科">內科</option>
                    <option value="02_婦科">婦科</option>
                    <option value="03_兒科">兒科</option>
                `;
                select.value = '01_內科';
            }

            await updateDiseaseFiltersForSelectedSubject();
        }

        async function loadCSVData(subjectKey) {
            try {
                console.log('正在載入加密數據:', subjectKey);

                if (typeof ENCRYPTED_DATASETS === 'undefined' || !ENCRYPTED_DATASETS) {
                    throw new Error('加密數據集未載入');
                }

                const encryptedData = ENCRYPTED_DATASETS[subjectKey];
                if (!encryptedData) {
                    throw new Error(`找不到科目數據: ${subjectKey}`);
                }

                const binaryString = atob(encryptedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decodedData = new TextDecoder('utf-8').decode(bytes);

                let jsonData = JSON.parse(decodedData);
                if (!Array.isArray(jsonData)) {
                    throw new Error('解密後資料格式不是陣列');
                }

                const headerAliases = {
                    '方药': '方藥',
                    '证型': '證型',
                    '证候': '證候',
                    '组成': '組成',
                    '組方': '組成'
                };

                const normalizeHeaderName = (header, index) => {
                    const raw = (header || '').toString().trim();
                    const withoutBom = index === 0 ? raw.replace(/^\uFEFF/, '') : raw;
                    const compact = withoutBom.replace(/\s+/g, '');
                    return headerAliases[compact] || compact;
                };

                const optionalExtendedFields = ['系列', '組成'];

                const normalizedData = jsonData
                    .map(row => {
                        const normalizedRow = {};
                        const keys = Object.keys(row || {});

                        keys.forEach((key, index) => {
                            const normalizedKey = normalizeHeaderName(key, index);
                            const value = row[key];
                            normalizedRow[normalizedKey] = typeof value === 'string'
                                ? value.replace(/[\u200B-\u200D\uFEFF]/g, '').trim()
                                : (value ?? '');
                        });

                        optionalExtendedFields.forEach(field => {
                            if (!(field in normalizedRow)) {
                                normalizedRow[field] = '';
                            }
                        });

                        return normalizedRow;
                    })
                    .filter(row => Object.values(row).some(value => (value || '').toString().trim() !== ''));

                if (normalizedData.length === 0) {
                    throw new Error('沒有有效的數據行');
                }

                console.log('成功載入數據條數:', normalizedData.length);
                console.log('前3條數據範例:', normalizedData.slice(0, 3));
                return normalizedData;
            } catch (error) {
                console.error('載入加密數據失敗:', error);
                alert('載入數據失敗: ' + error.message + '\n\n請檢查:\n1. encrypted_datasets.js 是否存在\n2. 科目鍵名是否正確\n3. 加密資料格式是否正確');
                return [];
            }
        }
    </script>
