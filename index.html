            if (questionText.classList.contains('has-overflow')) {
                questionText.classList.toggle('expanded');
            }
        }

        // 檢查文字是否被截斷
        function checkTextOverflow(element) {
            // 檢查滾動高度是否大於可見高度
            const hasVerticalOverflow = element.scrollHeight > element.clientHeight;
            
            // 額外檢查：臨時移除max-height限制來確認
            const originalMaxHeight = element.style.maxHeight;
            const originalOverflow = element.style.overflow;
            
            element.style.maxHeight = 'none';
            element.style.overflow = 'visible';
            
            const naturalHeight = element.offsetHeight;
            
            element.style.maxHeight = originalMaxHeight;
            element.style.overflow = originalOverflow;
            
            const constrainedHeight = element.offsetHeight;
            
            console.log(`文字溢出檢測: 自然高度=${naturalHeight}, 受限高度=${constrainedHeight}, 滾動高度=${element.scrollHeight}, 客戶端高度=${element.clientHeight}`);
            
            return hasVerticalOverflow || naturalHeight > constrainedHeight;
        }

        // 顯示當前題目
        function showCurrentQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showFinalScore();
                return;
            }

            isShowingFollowUpQuestion = false;
            pendingFollowUpQuestion = null;

            const question = currentQuestions[currentQuestionIndex];
            const optionCount = parseInt(document.getElementById('optionCount').value);

            // 添加數據結構檢查
            console.log('=== 顯示問題時的數據檢查 ===');
            console.log('問題索引:', currentQuestionIndex);
            console.log('完整問題對象:', question);
            console.log('問題數據 (question.data):', question.data);
            if (question.data) {
                console.log('數據欄位:', Object.keys(question.data));
                console.log('病名欄位值:', question.data['病名']);
                console.log('證型欄位值:', question.data['證型']);
            } else {
                console.error('⚠️ 問題沒有 data 屬性！');
            }

            // 更新進度
            const progress = ((currentQuestionIndex) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // 更新題目信息
            document.getElementById('questionNumber').textContent = 
                `第 ${currentQuestionIndex + 1} 題 / 共 ${totalQuestions} 題`;
            const questionTextElement = document.getElementById('questionText');
            questionTextElement.textContent = question.question;
            questionTextElement.classList.remove('expanded', 'has-overflow'); // 重置狀態
            
            // 檢查是否需要展開功能 - 使用更長的延遲確保渲染完成
            setTimeout(() => {
                // 強制重新計算佈局
                questionTextElement.offsetHeight;
                
                if (checkTextOverflow(questionTextElement)) {
                    questionTextElement.classList.add('has-overflow');
                    console.log('檢測到文字溢出，啟用展開功能');
                } else {
                    questionTextElement.classList.remove('has-overflow');
                    console.log('文字未溢出，不需要展開功能');
                }
            }, 50); // 增加延遲時間

            // 生成答案選項
            const options = generateAnswerOptions(question, currentDataset, optionCount, currentDifficultyMode);
            const optionsContainer = document.getElementById('answerOptions');
            optionsContainer.innerHTML = '';

            options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'answer-option';
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectAnswer(optionDiv, option);
                optionsContainer.appendChild(optionDiv);
            });

            // 重置按鈕狀態
            questionAnswered = false;
            document.getElementById('showAnswerBtn').style.display = 'inline-block';
            const nextButton = document.getElementById('nextQuestionBtn');
            nextButton.style.display = 'none';
            nextButton.textContent = '下一題';

            // 清除所有選項的選中狀態
            document.querySelectorAll('.answer-option').forEach(option => {
                option.classList.remove('selected', 'correct', 'incorrect');
                option.style.pointerEvents = 'auto'; // 重新啟用點擊
            });
        }

        function showFollowUpQuestion() {
            if (!pendingFollowUpQuestion) {
                currentQuestionIndex++;
                showCurrentQuestion();
                return;
            }

            isShowingFollowUpQuestion = true;
            questionAnswered = false;

            const followUp = pendingFollowUpQuestion;
            const questionTextElement = document.getElementById('questionText');
            questionTextElement.textContent = followUp.question;
            questionTextElement.classList.remove('expanded', 'has-overflow');

            document.getElementById('questionNumber').textContent =
                `第 ${currentQuestionIndex + 1} 題 / 共 ${totalQuestions} 題（追問）`;

            setTimeout(() => {
                questionTextElement.offsetHeight;
                if (checkTextOverflow(questionTextElement)) {
                    questionTextElement.classList.add('has-overflow');
                } else {
                    questionTextElement.classList.remove('has-overflow');
                }

                option.classList.remove('selected', 'correct', 'incorrect');
                option.style.pointerEvents = 'auto';
            });

        function selectFollowUpAnswer(element, answer) {
            if (questionAnswered || !pendingFollowUpQuestion) {
                return;
            }

            questionAnswered = true;
            const isCorrect = answer === pendingFollowUpQuestion.correctAnswer;

            followUpResults.push({
                questionNumber: currentQuestionIndex + 1,
                question: pendingFollowUpQuestion.question,
                userAnswer: answer,
                correctAnswer: pendingFollowUpQuestion.correctAnswer,
                isCorrect,
                mode: currentFollowUpMode,
                timestamp: new Date()
            });

            document.querySelectorAll('.answer-option').forEach(option => {
                option.classList.remove('selected');
                option.style.pointerEvents = 'none';
            });

            element.classList.add('selected');

            document.querySelectorAll('.answer-option').forEach(option => {
                if (option.textContent === pendingFollowUpQuestion.correctAnswer) {
                    option.classList.add('correct');
                } else if (option.classList.contains('selected')) {
                    option.classList.add('incorrect');
                }
            });

            document.getElementById('showAnswerBtn').style.display = 'none';
            const nextButton = document.getElementById('nextQuestionBtn');
            nextButton.style.display = 'inline-block';
            nextButton.textContent = '下一題';
        }

        function nextQuestion() {
            if (pendingFollowUpQuestion && !isShowingFollowUpQuestion) {
                showFollowUpQuestion();

        // 生成統計報告
        function generateStatisticsReport() {
            const correctAnswers = questionResults.filter(r => r.isCorrect).length;
            const incorrectAnswers = questionResults.filter(r => !r.isCorrect).length;
            const skippedAnswers = questionResults.filter(r => r.userAnswer === '未選擇').length;
            const percentage = Math.round((correctAnswers / totalQuestions) * 100);
            const followUpTotal = followUpResults.length;
            const followUpCorrect = followUpResults.filter(r => r.isCorrect).length;
            const followUpPercentage = followUpTotal > 0 ? Math.round((followUpCorrect / followUpTotal) * 100) : 0;
            
            // 計算平均答題時間（如果有時間戳記錄）
            let avgTime = 0;
            if (questionResults.length > 1) {
                const totalTime = questionResults[questionResults.length - 1].timestamp - questionResults[0].timestamp;
                avgTime = Math.round(totalTime / questionResults.length / 1000); // 秒
            }
            
            // 生成統計摘要
            const statsSummary = document.getElementById('statsSummary');
            statsSummary.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${correctAnswers}</div>
                    <div class="stat-label">答對題數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${incorrectAnswers}</div>
                    <div class="stat-label">答錯題數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${skippedAnswers}</div>
                    <div class="stat-label">跳過題數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${percentage}%</div>
                    <div class="stat-label">正確率</div>
                </div>
                ${avgTime > 0 ? `
                <div class="stat-item">
                    <div class="stat-value">${avgTime}s</div>
                    <div class="stat-label">平均答題時間</div>
                </div>
                ` : ''}
                ${currentFollowUpMode !== 'none' ? `
                <div class="stat-item">
                    <div class="stat-value">${followUpCorrect}/${followUpTotal}</div>
                    <div class="stat-label">追問答對</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${followUpPercentage}%</div>
                    <div class="stat-label">追問正確率</div>
                </div>
                ` : ''}
            `;
            
            // 生成詳細題目報告
            const statsDetails = document.getElementById('statsDetails');
            let detailsHTML = '<h4 style="color: white; margin-bottom: 15px;">📋 題目詳細分析</h4>';
            
            questionResults.forEach((result, index) => {
                detailsHTML += `
                    <div class="question-result ${result.isCorrect ? 'correct' : 'incorrect'}">
                        <div class="question-result-header">
                            ${result.isCorrect ? '✅' : '❌'} 第 ${result.questionNumber} 題
                        </div>
                        <div class="question-result-content">
                            <div><strong>題目：</strong></div>
                            <div style="white-space: pre-line; margin: 8px 0; font-size: 0.9em;">${result.question}</div>
                            
                            <div class="user-answer ${result.isCorrect ? 'correct' : 'incorrect'}">
                                <strong>您的答案：</strong><br>
                                ${result.userAnswer}
                            </div>
                            
                            ${!result.isCorrect ? `
                            <div class="correct-answer">
                                <strong>正確答案：</strong><br>
                                ${result.correctAnswer}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            if (followUpResults.length > 0) {
                detailsHTML += '<h4 style="color: white; margin: 20px 0 15px;">🔁 追問詳細分析</h4>';
                followUpResults.forEach(result => {
                    detailsHTML += `
                        <div class="question-result ${result.isCorrect ? 'correct' : 'incorrect'}">
                            <div class="question-result-header">
                                ${result.isCorrect ? '✅' : '❌'} 第 ${result.questionNumber} 題追問
                            </div>
                            <div class="question-result-content">
                                <div><strong>追問：</strong></div>
                                <div style="white-space: pre-line; margin: 8px 0; font-size: 0.9em;">${result.question}</div>

                                <div class="user-answer ${result.isCorrect ? 'correct' : 'incorrect'}">
                                    <strong>您的答案：</strong><br>
                                    ${result.userAnswer}
                                </div>

                                ${!result.isCorrect ? `
                                <div class="correct-answer">
                                    <strong>正確答案：</strong><br>
                                    ${result.correctAnswer}
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            
            statsDetails.innerHTML = detailsHTML;
        }

                            <p><strong>📊 學習統計功能：</strong></p>
                            <ul style="text-align: left; margin: 10px 0;">
                                <li>自動記錄每個病名+證型組合的答題情況</li>

            } else {

                console.log('所有統計項目:', Object.keys(stats));
                
                // 按正確率排序
                const sortedEntries = Object.entries(stats).sort((a, b) => {
                    const accuracyA = (a[1].correctAttempts / a[1].totalAttempts) || 0;
                    const accuracyB = (b[1].correctAttempts / b[1].totalAttempts) || 0;
                    return accuracyB - accuracyA;
                });

                console.log(`排序後準備顯示 ${sortedEntries.length} 個項目`);

                let tableHTML = `
                    <div style="margin-bottom: 15px; color: rgba(255,255,255,0.8);">
                        <small>📈 統計項目總數: ${sortedEntries.length} 個 | 數據更新時間: ${new Date().toLocaleString('zh-TW')}</small>
                    </div>
                    <table class="history-stats-table">
                        <thead>
                            <tr>
                                <th>病名</th>
                                <th>證型</th>
                                <th>答題次數</th>
                                <th>答對次數</th>
                                <th>正確率</th>
                                <th>最後練習時間</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                sortedEntries.forEach(([key, stat]) => {
                    const accuracy = ((stat.correctAttempts / stat.totalAttempts) * 100).toFixed(1);
                    const lastAttempt = stat.lastAttempt ? 
                        new Date(stat.lastAttempt).toLocaleString('zh-TW', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'

                        <tr>
                            <td>${stat.diseaseName}</td>
                            <td>${stat.syndromeType}</td>
                            <td>${stat.totalAttempts}</td>
                            <td>${stat.correctAttempts}</td>
                            <td>
                                <div class="accuracy-bar">
                                    <div class="accuracy-fill" style="width: ${accuracy}%"></div>
                                    <div class="accuracy-text">${accuracy}%</div>
                                </div>
                            </td>
                            <td>${lastAttempt}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                content.innerHTML = tableHTML;
            }
            
            // 隱藏遊戲區域，顯示歷史統計
            console.log('準備切換顯示區域...');
            
            if (mainContent) {
                mainContent.style.display = 'none';
                console.log('已隱藏主內容區域');
            } else {
                console.error('找不到主內容區域');
            }

                historySection.classList.remove('hidden');
                historySection.classList.add('show-history');
                console.log('已顯示歷史統計區域');

                console.error('找不到歷史統計區域');

        }

        // 清除歷史統計
        function clearHistoryStats() {
            if (confirm('確定要清除所有學習歷史記錄嗎？此操作無法復原。')) {
                deleteCookie('cmGameStudyStats');
                alert('學習歷史記錄已清除');
                showHistoryStats(); // 重新顯示空的統計
            }
        }

        // 隱藏歷史統計，返回遊戲
        function hideHistoryStats() {
            console.log('隱藏歷史統計，返回遊戲');
            const historyStatsSection = document.getElementById('historyStatsSection');
            const mainContentArea = document.querySelector('.main-content');
            
            if (historyStatsSection) {
                historyStatsSection.classList.remove('show-history');
                historyStatsSection.classList.add('hidden');
            }
            
            if (mainContentArea) {
                mainContentArea.style.display = 'block';
            }
        }

        // 匯出歷史統計
        function exportHistoryStats() {
            const stats = getStudyStats();
            
            if (!stats || Object.keys(stats).length === 0) {
                alert('暫無歷史記錄可匯出');
                return;
            }

            // 準備CSV格式的數據
            let csvContent = '\uFEFF病名,證型,答題次數,答對次數,正確率,首次練習時間,最後練習時間\n'; // 添加BOM以支援中文
            
            Object.entries(stats).forEach(([key, stat]) => {
                const accuracy = ((stat.correctAttempts / stat.totalAttempts) * 100).toFixed(1);
                const firstAttempt = stat.firstAttempt ? 
                    new Date(stat.firstAttempt).toLocaleString('zh-TW') : '未知';
                const lastAttempt = stat.lastAttempt ? 
                    new Date(stat.lastAttempt).toLocaleString('zh-TW') : '未知';
                
                csvContent += `"${stat.diseaseName}","${stat.syndromeType}",${stat.totalAttempts},${stat.correctAttempts},"${accuracy}%","${firstAttempt}","${lastAttempt}"\n`;
            });

            // 創建下載鏈接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', `中醫學習統計_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        // 測試Cookie功能
        function testCookieFunction() {
            console.log('=== 測試Cookie功能 ===');
            
            // 檢查當前協議
            console.log('當前協議:', window.location.protocol);
            console.log('當前主機:', window.location.host);
            
            if (window.location.protocol === 'file:') {
                alert('⚠️ 警告：您正在使用 file:// 協議訪問網頁。\n\nCookie功能可能無法正常工作，學習統計可能不會被保存。\n\n建議：\n1. 使用 Python 服務器啟動 (python server.py)\n2. 或使用 Live Server 等工具');
                return false;
            }
            
            // 測試設置和讀取Cookie
            const testData = { test: '測試數據', timestamp: new Date().toISOString() };
            setCookie('testCookie', testData);
            
            const retrievedData = getCookie('testCookie');
            
            if (retrievedData && retrievedData.test === '測試數據') {
                alert('✅ Cookie功能正常！學習統計應該可以正常保存。');
                deleteCookie('testCookie'); // 清除測試Cookie
                return true;
            } else {
                alert('❌ Cookie功能異常！學習統計可能無法保存。\n\n請檢查瀏覽器設置或使用HTTP服務器。');
                return false;
            }
        }

        // 檢查LocalStorage使用情況
        function checkStorageUsage() {
            console.log('=== LocalStorage 使用情況 ===');
            
            try {
                // 計算當前使用的空間
                let totalSize = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        const value = localStorage.getItem(key);
                        totalSize += key.length + (value ? value.length : 0);
                    }
                }
                
                console.log(`總使用空間: ${totalSize} 字符 (${(totalSize / 1024).toFixed(2)} KB)`);
                console.log(`項目數量: ${localStorage.length}`);
                
                // 顯示各個項目的大小
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        const value = localStorage.getItem(key);
                        const size = key.length + (value ? value.length : 0);
                        console.log(`- ${key}: ${size} 字符 (${(size / 1024).toFixed(2)} KB)`);
                    }
                }
                
                // 檢查統計數據
                const stats = getStudyStats();
                const statsCount = Object.keys(stats).length;
                console.log(`\n學習統計項目數: ${statsCount}`);
                
            } catch (error) {
                console.error('檢查存儲使用情況失敗:', error);
            }
        }
