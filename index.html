<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫學習選擇題遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .setup-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 14px;
            min-width: 0; /* 允許縮小 */
            line-height: 1.2;
        }

        .checkbox-item:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 6px;
            margin-top: 0;
            margin-bottom: 0;
            transform: scale(1.1);
            vertical-align: middle;
            flex-shrink: 0;
        }

        .checkbox-item label {
            margin: 0;
            line-height: 1.2;
            vertical-align: middle;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"]:checked + label {
            color: #667eea;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .difficulty-description {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .difficulty-description small {
            color: #6c757d;
            font-size: 13px;
            line-height: 1.4;
        }

        .category-filter-panel {
            border: 2px solid #dfe6ff;
            border-radius: 10px;
            background: #f8f9ff;
            overflow: hidden;
        }

        .category-filter-panel summary {
            padding: 12px 14px;
            cursor: pointer;
            font-weight: bold;
            color: #4156a8;
            user-select: none;
            background: #eef2ff;
        }

        .category-filter-panel[open] summary {
            border-bottom: 1px solid #dfe6ff;
        }

        .category-filter-actions {
            display: flex;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid #e3e8ff;
            flex-wrap: wrap;
        }

        .mini-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .mini-btn:hover {
            background: #5a6fd6;
        }

        .category-filter-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding: 12px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: white;
            border: 1px solid #e2e7ff;
            border-radius: 6px;
            font-size: 14px;
        }

        .category-item input[type="checkbox"] {
            transform: scale(1.1);
            flex-shrink: 0;
        }

        .category-filter-status {
            margin-top: 8px;
            color: #555;
            font-size: 13px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* 開始測驗按鈕特殊樣式 */
        .start-quiz-button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 30px auto 20px auto;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }

        .start-quiz-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(40, 167, 69, 0.4);
            background: linear-gradient(135deg, #218838 0%, #1ea080 100%);
        }

        .start-quiz-button:active {
            transform: translateY(-1px);
        }

        /* 其他按鈕區域 */
        .other-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .quiz-section {
            display: none;
        }

        .question-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.4em;
            line-height: 1.8;
            white-space: pre-line;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 300px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
        }

        .question-text:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .question-text.expanded {
            max-height: none;
        }

        .question-text.has-overflow:not(.expanded)::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        .question-text.has-overflow::after {
            content: "📖 點擊展開完整內容";
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .question-text.has-overflow.expanded::after {
            content: "📚 點擊收合內容";
        }

        .question-text.has-overflow:hover::after {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            transform: scale(1.05);
        }

        /* 當沒有溢出時，移除cursor pointer */
        .question-text:not(.has-overflow) {
            cursor: default;
        }

        .answer-options {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-option {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            white-space: pre-line;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .answer-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .answer-option.selected {
            border-color: #667eea;
            background: #e6f0ff;
        }

        .answer-option.correct {
            border-color: #28a745;
            background: #d4edda;
            color: #155724;
        }

        .answer-option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }

        .question-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-display {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.6;
        }

        .result-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .final-score {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-top: 20px;
        }

        .final-score h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .final-score .score {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }

        .statistics-report {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .statistics-report h3 {
            color: white;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        .stats-details {
            display: none;
            margin-top: 20px;
        }

        .stats-details.show {
            display: block;
        }

        .question-result {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .question-result.correct {
            border-left-color: #28a745;
        }

        .question-result.incorrect {
            border-left-color: #dc3545;
        }

        .question-result-header {
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
        }

        .question-result-content {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        .user-answer, .correct-answer {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .user-answer.correct {
            background: rgba(40, 167, 69, 0.2);
        }

        .user-answer.incorrect {
            background: rgba(220, 53, 69, 0.2);
        }

        .correct-answer {
            background: rgba(40, 167, 69, 0.2);
        }

        .final-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .stats-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .history-stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .history-stats-table th,
        .history-stats-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .history-stats-table th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        .history-stats-table tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .accuracy-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            position: relative;
            min-width: 100px;
        }

        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc3545 0%, #ffc107 50%, #28a745 100%);
            transition: width 0.3s ease;
        }

        .accuracy-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .no-stats-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            font-size: 1.1em;
        }

        .hidden {
            display: none !important;
        }

        .show-history {
            display: block !important;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .main-content {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .checkbox-item {
                padding: 6px 8px;
                font-size: 13px;
            }

            .category-filter-list {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            
            .start-quiz-button {
                padding: 16px 30px;
                font-size: 18px;
                margin: 25px auto 15px auto;
            }
            
            .other-buttons {
                gap: 10px;
            }
            
            .other-buttons .btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>中醫學習選擇題遊戲</h1>
            <p>即便現在你仍需學習，但在病人眼中你就是醫生。</p>
        </div>

        <div class="main-content">
            <!-- 遊戲設定區域 -->
            <div id="setupSection" class="setup-section">
                <div class="section-title">📚 科目選擇</div>
                <div class="form-group">
                    <label for="subjectSelect">選擇學習科目：</label>
                    <select id="subjectSelect">
                        <option value="">請選擇科目...</option>
                    </select>
                </div>

                <div class="section-title">🏷️ 題目分類</div>
                <div class="form-group">
                    <label>病名篩選（預設全選）：</label>
                    <details class="category-filter-panel">
                        <summary>點擊展開 / 收合病名清單</summary>
                        <div class="category-filter-actions">
                            <button type="button" class="mini-btn" onclick="selectAllDiseases()">全選</button>
                            <button type="button" class="mini-btn" onclick="unselectAllDiseases()">全部取消</button>
                        </div>
                        <div id="diseaseFilterList" class="category-filter-list"></div>
                    </details>
                    <div id="diseaseFilterStatus" class="category-filter-status">請先選擇科目以載入病名清單</div>
                </div>

                <div class="section-title">❓ 題型設定</div>
                <div class="form-group">
                    <label>問題將提供什麼資訊：</label>
                    <div class="checkbox-group" id="questionInfo">
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-病名" value="病名" checked>
                            <label for="info-病名">病名</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-證型" value="證型" checked>
                            <label for="info-證型">證型</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-治法" value="治法">
                            <label for="info-治法">治法</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-方藥" value="方藥">
                            <label for="info-方藥">方藥</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-證候" value="證候" checked>
                            <label for="info-證候">證候</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-系列" value="系列">
                            <label for="info-系列">系列</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="info-組成" value="組成">
                            <label for="info-組成">組成</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>答案組合的資料：</label>
                    <div class="checkbox-group" id="answerInfo">
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-病名" value="病名">
                            <label for="ans-病名">病名</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-證型" value="證型">
                            <label for="ans-證型">證型</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-治法" value="治法" checked>
                            <label for="ans-治法">治法</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-方藥" value="方藥" checked>
                            <label for="ans-方藥">方藥</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-證候" value="證候">
                            <label for="ans-證候">證候</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-系列" value="系列">
                            <label for="ans-系列">系列</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="ans-組成" value="組成">
                            <label for="ans-組成">組成</label>
                        </div>
                    </div>
                </div>

                <div class="section-title">⚙️ 遊戲設定</div>
                <div class="form-group">
                    <label for="optionCount">答案選項數量：</label>
                    <select id="optionCount">
                        <option value="2">2項</option>
                        <option value="3">3項</option>
                        <option value="4" selected>4項</option>
                        <option value="5">5項</option>
                        <option value="6">6項</option>
                        <option value="7">7項</option>
                        <option value="8">8項</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="questionCount">問題數量：</label>
                    <select id="questionCount">
                        <option value="10" selected>10題</option>
                        <option value="20">20題</option>
                        <option value="30">30題</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficultyMode">難度設定：</label>
                    <select id="difficultyMode">
                        <option value="normal">一般模式（隨機答案）</option>
                        <option value="hard">困難模式（同病名答案）</option>
                    </select>
                    <div class="difficulty-description">
                        <small>
                            <span id="difficultyDesc">一般模式：錯誤答案從所有資料中隨機選取</span>
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="followUpMode">追問模式：</label>
                    <select id="followUpMode">
                        <option value="none" selected>不啟用追問</option>
                        <option value="formula-composition">追問方藥的組成</option>
                        <option value="formula-series">追問方藥的系列（只顯示第一方藥）</option>
                        <option value="same-disease-syndrome">追問同病名的另一個證型</option>
                    </select>
                    <div class="difficulty-description">
                        <small>
                            <span id="followUpDesc">不啟用追問：只進行主題作答</span>
                        </small>
                    </div>
                </div>

                <!-- 開始測驗按鈕 -->
                <button class="start-quiz-button" onclick="startQuiz()">
                    🎯 開始測驗
                </button>

                <!-- 其他功能按鈕 -->
                <div class="other-buttons">

    <script src="encrypted_datasets.js"></script>
    <script>
        let currentDataset = [];
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let totalQuestions = 0;
        let questionAnswered = false;
        let currentDifficultyMode = 'normal';
        let currentFollowUpMode = 'none';
        let pendingFollowUpQuestion = null;
        let isShowingFollowUpQuestion = false;
        let questionResults = []; // 存儲每題的答題結果
        let followUpResults = []; // 存儲追問結果
        const QUIZ_SETTINGS_KEY = 'cmGameQuizSettings';

        // 更新checkbox項目的視覺狀態（已移除著色效果）
        function updateCheckboxItemStyle(item, isChecked) {
            // 不再需要視覺狀態更新，保留函數以免破壞現有代碼
        }

        // Cookie操作函數
        // ===== 本地存儲管理函數 =====
        
        // 設置本地存儲數據
        function setLocalStorage(key, value) {
            try {
                const jsonString = JSON.stringify(value);
                console.log(`📝 設置LocalStorage: ${key}`);
                console.log(`- 項目數量: ${typeof value === 'object' ? Object.keys(value).length : 'N/A'}`);
                console.log(`- 數據大小: ${jsonString.length} 字符`);
                
                localStorage.setItem(key, jsonString);
                console.log(`✅ LocalStorage已設置: ${key}`);
                
                // 立即驗證
                const verify = getLocalStorage(key);
                if (verify) {
                    const verifyCount = typeof verify === 'object' ? Object.keys(verify).length : 'N/A';
                    console.log(`🔍 LocalStorage設置驗證成功: ${key}, 項目數: ${verifyCount}`);
                } else {
                    console.error(`❌ LocalStorage設置驗證失敗: ${key}`);
                }
                
                return true;
            } catch (error) {
                console.error(`❌ 設置LocalStorage失敗: ${key}`, error);
                
                // 如果是存儲空間不足，嘗試清理
                if (error.name === 'QuotaExceededError') {
                    console.warn('⚠️ LocalStorage空間不足，嘗試清理舊數據');
                    if (key === 'cmGameStudyStats' && typeof value === 'object') {
                        return cleanAndSaveStats(value);
                    }
                }
                return false;
            }
        }
        
        // 獲取本地存儲數據
        function getLocalStorage(key) {
            try {
                const item = localStorage.getItem(key);
                if (item === null) {
                    console.log(`📭 LocalStorage中沒有找到: ${key}`);
                    return null;
                }
                
                const parsed = JSON.parse(item);
                console.log(`📬 成功讀取LocalStorage: ${key}`, typeof parsed === 'object' ? `項目數: ${Object.keys(parsed).length}` : parsed);
                return parsed;
            } catch (error) {
                console.error(`❌ 讀取LocalStorage失敗: ${key}`, error);
                return null;
            }
        }
        
        // 刪除本地存儲數據
        function removeLocalStorage(key) {
            try {
                localStorage.removeItem(key);
                console.log(`🗑️ 已刪除LocalStorage: ${key}`);
            } catch (error) {
                console.error(`❌ 刪除LocalStorage失敗: ${key}`, error);
            }
        }
        
        // 清理並保存統計數據
        function cleanAndSaveStats(stats) {
            try {
                const entries = Object.entries(stats);
                console.log(`當前統計項目數: ${entries.length}`);
                
                // 保留最近的50個項目
                const keepCount = 50;
                console.log(`清理統計數據，保留最近的 ${keepCount} 個項目`);
                
                // 按最後練習時間排序
                const sortedEntries = entries.sort((a, b) => {
                    const timeA = new Date(a[1].lastAttempt || 0);
                    const timeB = new Date(b[1].lastAttempt || 0);
                    return timeB - timeA;
                });
                
                const trimmedStats = {};
                sortedEntries.slice(0, keepCount).forEach(([key, stat]) => {
                    trimmedStats[key] = stat;
                });
                
                const cleanedString = JSON.stringify(trimmedStats);
                localStorage.setItem('cmGameStudyStats', cleanedString);
                
                console.log(`✅ 已清理並保存統計數據: ${Object.keys(trimmedStats).length} 個項目`);
                return true;
            } catch (error) {
                console.error(`❌ 清理統計數據失敗:`, error);
                return false;
            }
        }

        // 獲取學習統計數據
        function getStudyStats() {
            return getLocalStorage('cmGameStudyStats') || {};
        }

        // 設置checkbox群組的勾選值
        function setCheckedValues(containerId, values) {
            if (!Array.isArray(values)) {
                return;
            }

            const valueSet = new Set(values);
            const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = valueSet.has(checkbox.value);
                checkbox.dispatchEvent(new Event('change'));
            });
        }

        // 從數據中提取病名清單
        function extractDiseaseNames(data) {
            const uniqueNames = new Set();
            data.forEach(row => {
                const diseaseName = (row['病名'] || '').trim();
                if (diseaseName) {
                    uniqueNames.add(diseaseName);
                }
            });
            // Set 會保留插入順序，這裡可維持 CSV 原始病名順序
            return Array.from(uniqueNames);
        }

        // 更新病名篩選狀態文字
        function updateDiseaseFilterStatus() {
            const allCheckboxes = document.querySelectorAll('#diseaseFilterList input[type="checkbox"]');
            const selectedCheckboxes = document.querySelectorAll('#diseaseFilterList input[type="checkbox"]:checked');
            const status = document.getElementById('diseaseFilterStatus');

            if (!status) {
                return;
            }

            if (allCheckboxes.length === 0) {
                status.textContent = '當前科目沒有可用病名';
                return;
            }

            status.textContent = `已選擇 ${selectedCheckboxes.length} / ${allCheckboxes.length} 個病名`;
        }

        // 取得目前選中的病名
        function getSelectedDiseases() {
            const selected = document.querySelectorAll('#diseaseFilterList input[type="checkbox"]:checked');
            return Array.from(selected).map(item => item.value);
        }

        // 渲染病名篩選清單
        function renderDiseaseFilterList(diseaseNames, preselectedDiseases = null) {
            const list = document.getElementById('diseaseFilterList');
            if (!list) {
                return;
            }

            list.innerHTML = '';

            if (!Array.isArray(diseaseNames) || diseaseNames.length === 0) {
                updateDiseaseFilterStatus();
                return;
            }

            let selectedSet = null;
            if (Array.isArray(preselectedDiseases)) {
                const validSelections = preselectedDiseases.filter(name => diseaseNames.includes(name));

                if (preselectedDiseases.length === 0) {
                    selectedSet = new Set();
                } else if (validSelections.length > 0) {
                    selectedSet = new Set(validSelections);
                }
            }

            diseaseNames.forEach(name => {
                const item = document.createElement('label');
                item.className = 'category-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = name;
                checkbox.checked = selectedSet === null ? true : selectedSet.has(name);
                checkbox.addEventListener('change', updateDiseaseFilterStatus);

                const labelText = document.createElement('span');
                labelText.textContent = name;

                item.appendChild(checkbox);
                item.appendChild(labelText);
                list.appendChild(item);
            });

            updateDiseaseFilterStatus();
        }

        // 全選/取消病名勾選
        function setAllDiseaseSelection(checked) {
            const checkboxes = document.querySelectorAll('#diseaseFilterList input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = checked;
            });
            updateDiseaseFilterStatus();
        }

        function selectAllDiseases() {
            setAllDiseaseSelection(true);
        }

        function unselectAllDiseases() {
            setAllDiseaseSelection(false);
        }

        // 根據科目更新病名篩選清單
        async function updateDiseaseFiltersForSelectedSubject(preselectedDiseases = null) {
            const subjectSelect = document.getElementById('subjectSelect');
            const selectedSubject = subjectSelect ? subjectSelect.value : '';
            const status = document.getElementById('diseaseFilterStatus');

            if (!selectedSubject) {
                renderDiseaseFilterList([]);
                if (status) {
                    status.textContent = '請先選擇科目以載入病名清單';
                }
                return;
            }

            if (status) {
                status.textContent = '載入病名清單中...';
            }

            const data = await loadCSVData(selectedSubject);
            const diseaseNames = extractDiseaseNames(data);
            renderDiseaseFilterList(diseaseNames, preselectedDiseases);
        }

        // 收集目前題目設定
        function collectQuizSettings() {
            return {
                subject: document.getElementById('subjectSelect').value,
                questionInfo: getCheckedValues('questionInfo'),
                answerInfo: getCheckedValues('answerInfo'),
                optionCount: document.getElementById('optionCount').value,
                questionCount: document.getElementById('questionCount').value,
                difficultyMode: document.getElementById('difficultyMode').value,
                followUpMode: document.getElementById('followUpMode').value,
                selectedDiseases: getSelectedDiseases()
            };
        }

        // 保存題目設定
        function saveQuizSettings() {
            const settings = collectQuizSettings();
            const saveSuccess = setLocalStorage(QUIZ_SETTINGS_KEY, settings);

            if (saveSuccess) {
                alert('✅ 題目設定已保存，下次開啟首頁會自動載入。');
            } else {
                alert('❌ 題目設定保存失敗，請稍後重試。');
            }
        }

        // 套用已保存題目設定
        async function applySavedQuizSettings() {
            const savedSettings = getLocalStorage(QUIZ_SETTINGS_KEY);
            if (!savedSettings || typeof savedSettings !== 'object') {
                await updateDiseaseFiltersForSelectedSubject();
                return;
            }

            const subjectSelect = document.getElementById('subjectSelect');
            if (savedSettings.subject && subjectSelect) {
                const hasSubject = Array.from(subjectSelect.options).some(option => option.value === savedSettings.subject);
                if (hasSubject) {
                    subjectSelect.value = savedSettings.subject;
                }
            }

            setCheckedValues('questionInfo', savedSettings.questionInfo);
            setCheckedValues('answerInfo', savedSettings.answerInfo);

            if (savedSettings.optionCount) {
                document.getElementById('optionCount').value = savedSettings.optionCount;
            }
            if (savedSettings.questionCount) {
                document.getElementById('questionCount').value = savedSettings.questionCount;
            }
            if (savedSettings.difficultyMode) {
                document.getElementById('difficultyMode').value = savedSettings.difficultyMode;
            }
            if (savedSettings.followUpMode) {
                document.getElementById('followUpMode').value = savedSettings.followUpMode;
            }

            await updateDiseaseFiltersForSelectedSubject(savedSettings.selectedDiseases);

            const difficultySelect = document.getElementById('difficultyMode');
            if (difficultySelect) {
                difficultySelect.dispatchEvent(new Event('change'));
            }

            const followUpSelect = document.getElementById('followUpMode');
            if (followUpSelect) {
                followUpSelect.dispatchEvent(new Event('change'));
            }
        }

        // 保存學習統計數據
        function saveStudyStats(stats) {
            return setLocalStorage('cmGameStudyStats', stats);
        }

        // 更新特定病名+證型的統計
        function updateStudyStats(diseaseName, syndromeType, isCorrect) {
            console.log(`\n=== 更新學習統計 ===`);
            console.log(`病名: ${diseaseName}, 證型: ${syndromeType}, 正確: ${isCorrect}`);
            
            if (!diseaseName || !syndromeType) {
                console.error('❌ 統計更新失敗：病名或證型為空');
                return;
            }
            
            // 讀取當前統計數據
            const stats = getStudyStats();
            const beforeCount = Object.keys(stats).length;
            console.log(`📊 更新前統計項目數量: ${beforeCount}`);
            
            const key = `${diseaseName}_${syndromeType}`;
            console.log(`🔑 統計鍵值: ${key}`);
            
            // 檢查是否為新項目
            const isNewEntry = !stats[key];
            console.log(`📝 是否為新項目: ${isNewEntry ? '是' : '否'}`);
            
            if (isNewEntry) {
                stats[key] = {
                    diseaseName: diseaseName,
                    syndromeType: syndromeType,
                    totalAttempts: 0,
                    correctAttempts: 0,
                    lastAttempt: null,
                    firstAttempt: new Date().toISOString()
                };
                console.log(`✨ 創建新的統計項目: ${key}`);
            } else {
                console.log(`🔄 更新現有統計項目: ${key}`);
            }
            
            // 記錄更新前的狀態
            const beforeUpdate = { ...stats[key] };
            
            // 更新統計數據
            stats[key].totalAttempts++;
            if (isCorrect) {
                stats[key].correctAttempts++;
            }
            stats[key].lastAttempt = new Date().toISOString();
            
            console.log(`📈 統計更新:`);
            console.log(`   總次數: ${beforeUpdate.totalAttempts} → ${stats[key].totalAttempts}`);
            console.log(`   正確次數: ${beforeUpdate.correctAttempts} → ${stats[key].correctAttempts}`);
            
            const afterCount = Object.keys(stats).length;
            console.log(`📊 更新後統計項目數量: ${beforeCount} → ${afterCount}`);
            
            try {
                // 檢查數據大小
                const statsString = JSON.stringify(stats);
                console.log(`💾 統計數據JSON大小: ${statsString.length} 字符`);
                
                // 保存統計數據
                saveStudyStats(stats);
                console.log(`✅ 統計數據已保存`);
                
                // 立即驗證保存結果
                setTimeout(() => {
                    const savedStats = getStudyStats();
                    const savedCount = Object.keys(savedStats).length;
                    const savedItem = savedStats[key];
                    
                    console.log(`� 保存驗證結果:`);
                    console.log(`   期望項目數: ${afterCount}, 實際項目數: ${savedCount}`);
                    console.log(`   期望項目存在: ${key}`);
                    console.log(`   實際項目內容:`, savedItem);
                    
                    // 更精確的驗證
                    const itemExists = savedItem && typeof savedItem === 'object' && savedItem.diseaseName === diseaseName;
                    const countMatches = savedCount === afterCount; // 精確匹配項目數
                    
                    console.log(`   項目存在檢查: ${itemExists}`);
                    console.log(`   項目數檢查: ${countMatches}`);
                    
                    if (itemExists && countMatches) {
                        console.log(`✅ 統計數據保存驗證成功`);
                    } else {
                        console.error(`❌ 統計數據保存驗證失敗`);
                        console.log(`期望統計:`, stats[key]);
                        console.log(`實際統計:`, savedItem);
                        console.log(`保存的所有項目:`, Object.keys(savedStats));
                        
                        // 檢查 LocalStorage 是否真的存在
                        const rawStorage = localStorage.getItem('cmGameStudyStats');
                        const hasStats = rawStorage !== null;
                        console.log(`LocalStorage 存在檢查: ${hasStats}`);
                        console.log(`LocalStorage 數據長度: ${rawStorage ? rawStorage.length : 0} 字符`);
                        if (!hasStats) {
                            console.error(`❌ LocalStorage 根本沒有被設置！`);
                        } else {
                            console.log(`LocalStorage 數據片段:`, rawStorage.substring(0, 200) + '...');
                        }
                    }
                }, 100);
                
            } catch (error) {
                console.error(`❌ 統計保存失敗:`, error);
            }
        }

        // 頁面加載時初始化
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('=== 中醫學習選擇題遊戲初始化 ===');
            console.log('瀏覽器:', navigator.userAgent);
            console.log('當前網址:', window.location.href);
            
            // 檢查是否通過服務器訪問
            if (window.location.protocol === 'file:') {
                console.warn('警告：您正在通過 file:// 協議訪問，可能會遇到CORS問題');
                console.log('建議：請使用 Python 服務器啟動遊戲 (python server.py)');
            } else {
                console.log('✓ 正在通過HTTP服務器訪問');
            }
            
            // 為所有checkbox-item添加點擊事件
            document.querySelectorAll('.checkbox-item').forEach(item => {
                const checkbox = item.querySelector('input[type="checkbox"]');
                const label = item.querySelector('label');
                
                // 初始化選中狀態樣式
                if (checkbox) {
                    updateCheckboxItemStyle(item, checkbox.checked);
                    
                    // 監聽checkbox狀態變化
                    checkbox.addEventListener('change', function() {
                        updateCheckboxItemStyle(item, this.checked);
                    });
                }
                
                // 點擊整個項目切換checkbox（但不包括checkbox本身和label）
                item.addEventListener('click', function(e) {
                    // 如果點擊的是checkbox本身或label，讓瀏覽器默認行為處理
                    if (e.target.type === 'checkbox' || e.target.tagName === 'LABEL') {
                        return;
                    }
                    
                    // 否則，手動切換checkbox狀態
                    if (checkbox) {
                        checkbox.checked = !checkbox.checked;
                        // 觸發change事件
                        checkbox.dispatchEvent(new Event('change'));
                    }
                });
            });

            // 難度模式描述更新
            const difficultySelect = document.getElementById('difficultyMode');
            const difficultyDesc = document.getElementById('difficultyDesc');
            
            if (difficultySelect && difficultyDesc) {
                difficultySelect.addEventListener('change', function() {
                    if (this.value === 'hard') {
                        difficultyDesc.textContent = '困難模式：錯誤答案僅從相同病名的其他證型/治法/方藥中選取，更具挑戰性';
                    } else {
                        difficultyDesc.textContent = '一般模式：錯誤答案從所有資料中隨機選取';
                    }
                });
            }

            const followUpSelect = document.getElementById('followUpMode');
            const followUpDesc = document.getElementById('followUpDesc');

            if (followUpSelect && followUpDesc) {
                followUpSelect.addEventListener('change', function() {
                    const descMap = {
                        'none': '不啟用追問：只進行主題作答',
                        'formula-composition': '主題作答後追問：該方藥的組成是什麼',
                        'formula-series': '主題作答後追問：該方藥屬於哪個系列（同系列答案會自動合併）',
                        'same-disease-syndrome': '主題作答後追問：同病名下的另一個證型'
                    };
                    followUpDesc.textContent = descMap[this.value] || descMap.none;
                });
            }

            const subjectSelect = document.getElementById('subjectSelect');
            if (subjectSelect) {
                subjectSelect.addEventListener('change', async function() {
                    await updateDiseaseFiltersForSelectedSubject();
                });
            }
            
            await loadDatasetFiles();
            await applySavedQuizSettings();
        });

        // 載入數據集文件（GitHub Pages 版使用加密數據集）
        async function loadDatasetFiles() {
            console.log('載入加密數據集科目列表...');

            try {
                if (typeof ENCRYPTED_DATASETS === 'undefined' || !ENCRYPTED_DATASETS) {
                    throw new Error('加密數據集未載入');
                }

                const subjects = Object.keys(ENCRYPTED_DATASETS);
                if (subjects.length === 0) {
                    throw new Error('加密數據集沒有任何科目');
                }

                const select = document.getElementById('subjectSelect');
                select.innerHTML = '<option value="">請選擇科目...</option>';

                subjects.forEach(subjectKey => {
                    const option = document.createElement('option');
                    option.value = subjectKey;
                    option.textContent = subjectKey.includes('_')
                        ? subjectKey.split('_').slice(1).join('_')
                        : subjectKey;
                    select.appendChild(option);
                });

                select.value = subjects[0];
                console.log('科目選項已載入完成:', subjects);

            } catch (error) {
                console.error('載入加密科目列表失敗，使用備援科目:', error);
                const select = document.getElementById('subjectSelect');
                select.innerHTML = `
                    <option value="">請選擇科目...</option>
                    <option value="01_內科">內科</option>
                    <option value="02_婦科">婦科</option>
                    <option value="03_兒科">兒科</option>
                `;
                select.value = '01_內科';
            }

            await updateDiseaseFiltersForSelectedSubject();
        }

        // 載入並解密數據（Base64 JSON）
        async function loadCSVData(subjectKey) {
            try {
                console.log('正在載入加密數據:', subjectKey);

                if (typeof ENCRYPTED_DATASETS === 'undefined' || !ENCRYPTED_DATASETS) {
                    throw new Error('加密數據集未載入');
                }

                const encryptedData = ENCRYPTED_DATASETS[subjectKey];
                if (!encryptedData) {
                    throw new Error(`找不到科目數據: ${subjectKey}`);
                }

                const binaryString = atob(encryptedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decodedData = new TextDecoder('utf-8').decode(bytes);

                let jsonData = JSON.parse(decodedData);
                if (!Array.isArray(jsonData)) {
                    throw new Error('解密後資料格式不是陣列');
                }

                const headerAliases = {
                    '方药': '方藥',
                    '证型': '證型',
                    '证候': '證候',
                    '组成': '組成',
                    '組方': '組成'
                };

                const normalizeHeaderName = (header, index) => {
                    const raw = (header || '').toString().trim();
                    const withoutBom = index === 0 ? raw.replace(/^\uFEFF/, '') : raw;
                    const compact = withoutBom.replace(/\s+/g, '');
                    return headerAliases[compact] || compact;
                };

                const optionalExtendedFields = ['系列', '組成'];

                const normalizedData = jsonData
                    .map(row => {
                        const normalizedRow = {};
                        const keys = Object.keys(row || {});

                        keys.forEach((key, index) => {
                            const normalizedKey = normalizeHeaderName(key, index);
                            const value = row[key];
                            normalizedRow[normalizedKey] = typeof value === 'string'
                                ? value.replace(/[\u200B-\u200D\uFEFF]/g, '').trim()
                                : (value ?? '');
                        });

                        optionalExtendedFields.forEach(field => {
                            if (!(field in normalizedRow)) {
                                normalizedRow[field] = '';
                            }
                        });

                        return normalizedRow;
                    })
                    .filter(row => Object.values(row).some(value => (value || '').toString().trim() !== ''));

                if (normalizedData.length === 0) {
                    throw new Error('沒有有效的數據行');
                }

                console.log('成功載入數據條數:', normalizedData.length);
                console.log('前3條數據範例:', normalizedData.slice(0, 3));
                return normalizedData;
            } catch (error) {
                console.error('載入加密數據失敗:', error);
                alert('載入數據失敗: ' + error.message + '\n\n請檢查:\n1. encrypted_datasets.js 是否存在\n2. 科目鍵名是否正確\n3. 加密資料格式是否正確');
                return [];
            }
        }

        // 獲取選中的選項
        function getCheckedValues(containerId) {
            const container = document.getElementById(containerId);
            const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function normalizeTextValue(value) {
            return (value || '').toString().replace(/\s+/g, ' ').trim();
        }

        function shuffleArray(items) {
            return [...items].sort(() => Math.random() - 0.5);
        }

        function getUniqueFieldValues(rows, fieldName, options = {}) {
            const { excludeValues = [], allowValueNone = true } = options;
            const excluded = new Set(excludeValues.map(value => normalizeTextValue(value)));
            const uniqueMap = new Map();

            rows.forEach(row => {
                const rawValue = (row[fieldName] || '').toString().trim();
                if (!rawValue) {
                    return;
                }
                if (!allowValueNone && rawValue === '無') {
                    return;
                }

                const normalized = normalizeTextValue(rawValue);
                if (!normalized || excluded.has(normalized) || uniqueMap.has(normalized)) {
                    return;
                }

                uniqueMap.set(normalized, rawValue);
            });

            return Array.from(uniqueMap.values());
        }

        function extractCompositionIngredientsFromLine(line) {
            let text = (line || '').toString().trim();
            if (!text) {
                return '';
            }

            // 移除條目序號，例如 1.、1.1、2)
            text = text.replace(/^\d+(?:\.\d+)?\s*[.、．)）]?\s*/, '').trim();

            // 去掉前導來源註記，例如 [五版教材 p.289]
            text = text.replace(/^(?:\[[^\]]+\]\s*)+/, '').trim();

            // 若有「方名 - 組成」格式，只保留組成部分
            const dashMatch = text.match(/^[^,，、:：;；\n]{1,30}\s*[-－—]\s*(.+)$/);
            if (dashMatch) {
                text = dashMatch[1].trim();
            }

            // 再次清除可能殘留在開頭的來源註記
            text = text.replace(/^(?:\[[^\]]+\]\s*)+/, '').trim();

            // 單獨的「另服某方」不是組成內容，直接忽略
            if (!/[、,，]/.test(text) && /^另服/.test(text)) {
                return '';
            }

            // 單純方名（無藥物分隔符）不作為組成選項
            if (!/[、,，]/.test(text) && /^[^\s]{1,20}(湯|散|丸|飲|丹|方|煎|膏|劑)(加味)?$/.test(text)) {
                return '';
            }

            return text.replace(/[。；;]+$/, '').trim();
        }

        function normalizeCompositionForQuiz(rawComposition) {
            const original = (rawComposition || '').toString().replace(/\r\n/g, '\n').trim();
            if (!original || original === '無') {
                return '';
            }

            const numberedBlockRegex = /(?:^|\n)\s*\d+(?:\.\d+)?\s*[.、．)）]?\s*([\s\S]*?)(?=(?:\n\s*\d+(?:\.\d+)?\s*[.、．)）]?\s*)|$)/g;
            const blocks = [];
            let match;

            while ((match = numberedBlockRegex.exec(original)) !== null) {
                blocks.push(match[1].trim());
            }

            const ingredients = [];

            if (blocks.length > 0) {
                // 有明確編號時，每個編號只取第一個有效組成行，避免同方不同來源重覆暴露
                blocks.forEach(block => {
                    const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
                    for (const line of lines) {
                        const parsed = extractCompositionIngredientsFromLine(line);
                        if (parsed) {
                            ingredients.push(parsed);
                            break;
                        }
                    }
                });
            } else {
                original.split('\n').map(line => line.trim()).filter(Boolean).forEach(line => {
                    const parsed = extractCompositionIngredientsFromLine(line);
                    if (parsed) {
                        ingredients.push(parsed);
                    }
                });
            }

            if (ingredients.length === 0) {
                return extractCompositionIngredientsFromLine(original) || original;
            }

            return ingredients.join('、');
        }

        function getUniqueNormalizedCompositions(rows, excludeValues = []) {
            const excluded = new Set(excludeValues.map(value => normalizeTextValue(value)));
            const uniqueMap = new Map();

            rows.forEach(row => {
                const normalizedComposition = normalizeCompositionForQuiz(row['組成']);
                if (!normalizedComposition) {
                    return;
                }

                const key = normalizeTextValue(normalizedComposition);
                if (!key || excluded.has(key) || uniqueMap.has(key)) {
                    return;
                }

                uniqueMap.set(key, normalizedComposition);
            });

            return Array.from(uniqueMap.values());
        }

        function buildFollowUpOptions(correctAnswer, wrongAnswerPool, optionCount) {
            const normalizedCorrect = normalizeTextValue(correctAnswer);
            const wrongMap = new Map();

            wrongAnswerPool.forEach(answer => {
                const normalized = normalizeTextValue(answer);
                if (!normalized || normalized === normalizedCorrect || wrongMap.has(normalized)) {
                    return;
                }
                wrongMap.set(normalized, answer);
            });

            const wrongAnswers = shuffleArray(Array.from(wrongMap.values())).slice(0, Math.max(optionCount - 1, 1));
            return shuffleArray([correctAnswer, ...wrongAnswers]);
        }

        function canGenerateFollowUpForRow(row, allData, followUpMode) {
            if (followUpMode === 'none') {
                return true;
            }

            if (followUpMode === 'formula-composition') {
                const composition = normalizeCompositionForQuiz(row['組成']);
                if (!composition) {
                    return false;
                }

                const alternatives = getUniqueNormalizedCompositions(allData, [composition]);

                return alternatives.length > 0;
            }

            if (followUpMode === 'formula-series') {
                const series = (row['系列'] || '').toString().trim();
                if (!series) {
                    return false;
                }

                const alternatives = getUniqueFieldValues(allData, '系列', {
                    excludeValues: [series]
                });

                return alternatives.length > 0;
            }

            if (followUpMode === 'same-disease-syndrome') {
                const diseaseName = (row['病名'] || '').toString().trim();
                const syndromeType = (row['證型'] || '').toString().trim();

                if (!diseaseName || !syndromeType) {
                    return false;
                }

                const sameDiseaseRows = allData.filter(item => (item['病名'] || '').toString().trim() === diseaseName);
                const alternativeSyndromes = getUniqueFieldValues(sameDiseaseRows, '證型', {
                    excludeValues: [syndromeType]
                });

                if (alternativeSyndromes.length === 0) {
                    return false;
                }

                // 錯誤選項必須排除同病名的其他證型，確保僅有一個同病名證型（正確答案）
                const wrongPool = getUniqueFieldValues(allData, '證型', {
                    excludeValues: [syndromeType, ...alternativeSyndromes]
                });

                return wrongPool.length > 0;
            }

            return false;
        }

        function generateFollowUpQuestion(mainQuestion, allData, optionCount, followUpMode) {
            if (followUpMode === 'none') {
                return null;
            }

            const row = mainQuestion.data || {};
            const formulaName = (row['方藥'] || '').toString().trim();

            if (followUpMode === 'formula-composition') {
                const composition = normalizeCompositionForQuiz(row['組成']);
                if (!formulaName || !composition) {
                    return null;
                }

                const wrongPool = getUniqueNormalizedCompositions(allData, [composition]);
                const options = buildFollowUpOptions(composition, wrongPool, optionCount);

                if (options.length < 2) {
                    return null;
                }

                return {
                    type: 'formula-composition',
                    question: `追問：方藥「${formulaName}」的組成是？`,
                    correctAnswer: composition,
                    options
                };
            }

            if (followUpMode === 'formula-series') {
                const series = (row['系列'] || '').toString().trim();
                if (!formulaName || !series) {
                    return null;
                }

                // 系列追問會先做去重，避免重覆系列出現在選項中
                const wrongPool = getUniqueFieldValues(allData, '系列', {
                    excludeValues: [series]
                });
                const options = buildFollowUpOptions(series, wrongPool, optionCount);

                if (options.length < 2) {
                    return null;
                }

                return {
                    type: 'formula-series',
                    question: `追問：方藥「${formulaName}」屬於哪個系列？`,
                    correctAnswer: series,
                    options
                };
            }

            if (followUpMode === 'same-disease-syndrome') {
                const diseaseName = (row['病名'] || '').toString().trim();
                const currentSyndrome = (row['證型'] || '').toString().trim();

                if (!diseaseName || !currentSyndrome) {
                    return null;
                }

                const sameDiseaseRows = allData.filter(item => (item['病名'] || '').toString().trim() === diseaseName);
                const alternativeSyndromes = getUniqueFieldValues(sameDiseaseRows, '證型', {
                    excludeValues: [currentSyndrome]
                });

                if (alternativeSyndromes.length === 0) {
                    return null;
                }

                const correctAnswer = alternativeSyndromes[Math.floor(Math.random() * alternativeSyndromes.length)];

                // 排除同病名所有可替代證型，避免選項中出現多個同病名的另一證型
                const wrongPool = getUniqueFieldValues(allData, '證型', {
                    excludeValues: [currentSyndrome, ...alternativeSyndromes]
                });
                const options = buildFollowUpOptions(correctAnswer, wrongPool, optionCount);

                if (options.length < 2) {
                    return null;
                }

                return {
                    type: 'same-disease-syndrome',
                    question: `追問：病名「${diseaseName}」中，下列哪一項是「${currentSyndrome}」以外的另一個證型？`,
                    correctAnswer,
                    options
                };
            }

            return null;
        }

        // 生成題目
        function generateQuestions(data, questionInfo, answerInfo, count) {
            console.log('開始生成題目，數據量:', data.length);
            const questions = [];
            const usedCombinations = new Set();
            let attempts = 0;
            const maxAttempts = count * 20; // 增加嘗試次數以獲得更多樣化的組合

            while (questions.length < count && attempts < maxAttempts) {
                attempts++;
                const randomRow = data[Math.floor(Math.random() * data.length)];
                
                // 檢查所需欄位是否有值
                const hasQuestionInfo = questionInfo.every(info => randomRow[info] && randomRow[info].trim() !== '');
                const hasAnswerInfo = answerInfo.every(info => randomRow[info] && randomRow[info].trim() !== '');
                
                if (!hasQuestionInfo || !hasAnswerInfo) {
                    continue; // 跳過資料不完整的行
                }
                
                // 使用病名+證型創建唯一標識符，而不是問題資訊
                // 這樣可以確保每個病名證型組合都有機會被選中
                const diseaseName = randomRow['病名'] || '';
                const syndromeType = randomRow['證型'] || '';
                const uniqueKey = `${diseaseName}_${syndromeType}`;
                
                console.log(`嘗試 ${attempts}: ${uniqueKey}`);
                
                if (usedCombinations.has(uniqueKey)) {
                    console.log(`跳過重複組合: ${uniqueKey}`);
                    continue;
                }
                usedCombinations.add(uniqueKey);
                console.log(`添加新組合: ${uniqueKey}`);

                // 構建問題文本
                let questionText = '根據以下資訊：\n';
                questionInfo.forEach(info => {
                    if (randomRow[info] && randomRow[info].trim()) {
                        questionText += `${info}：${randomRow[info]}\n`;
                    }
                });
                questionText += `\n請選擇正確的${answerInfo.join('、')}：`;

                // 構建正確答案
                const correctAnswer = answerInfo.map(info => {
                    return (randomRow[info] && randomRow[info].trim()) ? `${info}：${randomRow[info]}` : '';
                }).filter(item => item).join('\n');

                if (correctAnswer.trim()) {
                    questions.push({
                        question: questionText,
                        correctAnswer: correctAnswer,
                        data: randomRow,
                        questionInfo: questionInfo,
                        answerInfo: answerInfo
                    });
                    
                    console.log(`生成第 ${questions.length} 題`);
                }
            }

            console.log(`總共生成 ${questions.length} 題，嘗試 ${attempts} 次`);
            return questions;
        }

        // 生成答案選項
        function generateAnswerOptions(question, allData, optionCount, difficultyMode = 'normal') {
            const options = [question.correctAnswer];
            const usedAnswers = new Set([question.correctAnswer]);
            let attempts = 0;
            const maxAttempts = optionCount * 50; // 增加嘗試次數以適應困難模式

            // 獲取候選數據池
            let candidateData = allData;
            if (difficultyMode === 'hard') {
                // 困難模式：只從相同病名的資料中選取
                const correctDiseaseName = question.data['病名'];
                if (correctDiseaseName) {
                    candidateData = allData.filter(row => 
                        row['病名'] === correctDiseaseName && 
                        row !== question.data // 排除正確答案本身
                    );
                    console.log(`困難模式：從 ${candidateData.length} 個相同病名「${correctDiseaseName}」的資料中選取錯誤答案`);
                    
                    // 如果同病名的資料不足，降級為普通模式
                    if (candidateData.length < optionCount - 1) {
                        console.log('同病名資料不足，降級為一般模式');
                        candidateData = allData;
                        difficultyMode = 'normal';
                    }
                }
            }

            while (options.length < optionCount && attempts < maxAttempts) {
                attempts++;
                const randomRow = candidateData[Math.floor(Math.random() * candidateData.length)];
                
                // 檢查隨機行是否有所需的答案資訊
                const hasAnswerData = question.answerInfo.every(info => 
                    randomRow[info] && randomRow[info].trim() !== ''
                );
                
                if (!hasAnswerData) {
                    continue;
                }
                
                const fakeAnswer = question.answerInfo.map(info => {
                    return (randomRow[info] && randomRow[info].trim()) ? `${info}：${randomRow[info]}` : '';
                }).filter(item => item).join('\n');

                if (fakeAnswer.trim() && 
                    !usedAnswers.has(fakeAnswer) && 
                    fakeAnswer !== question.correctAnswer) {
                    options.push(fakeAnswer);
                    usedAnswers.add(fakeAnswer);
                }
            }

            // 如果無法生成足夠的選項，用佔位符填充
            while (options.length < optionCount) {
                const placeholderAnswer = question.answerInfo.map(info => 
                    `${info}：[選項 ${options.length}]`
                ).join('\n');
                
                if (!usedAnswers.has(placeholderAnswer)) {
                    options.push(placeholderAnswer);
                    usedAnswers.add(placeholderAnswer);
                }
            }

            console.log(`${difficultyMode === 'hard' ? '困難模式' : '一般模式'}：為題目生成了 ${options.length} 個選項`);
            
            // 隨機排序選項
            return options.sort(() => Math.random() - 0.5);
        }

        // 開始測驗
        async function startQuiz() {
            console.log('開始測驗...');
            
            const selectedSubject = document.getElementById('subjectSelect').value;
            const questionInfo = getCheckedValues('questionInfo');
            const answerInfo = getCheckedValues('answerInfo');
            const selectedDiseases = getSelectedDiseases();
            const optionCount = parseInt(document.getElementById('optionCount').value);
            const questionCount = parseInt(document.getElementById('questionCount').value);
            const difficultyMode = document.getElementById('difficultyMode').value;
            const followUpMode = document.getElementById('followUpMode').value;
            let effectiveFollowUpMode = followUpMode;

            console.log('測驗設定:', {
                科目: selectedSubject,
                問題資訊: questionInfo,
                答案資訊: answerInfo,
                病名篩選: selectedDiseases,
                選項數量: optionCount,
                問題數量: questionCount,
                難度模式: difficultyMode,
                追問模式: followUpMode
            });

            // 驗證設定
            if (!selectedSubject) {
                alert('請選擇科目');
                return;
            }
            if (questionInfo.length === 0) {
                alert('請選擇至少一項問題資訊');
                return;
            }
            if (answerInfo.length === 0) {
                alert('請選擇至少一項答案資訊');
                return;
            }
            if (selectedDiseases.length === 0) {
                alert('請至少勾選一個病名分類');
                return;
            }

            // 顯示載入中狀態
            const startButton = document.querySelector('button[onclick="startQuiz()"]');
            const originalText = startButton.textContent;
            startButton.textContent = '🔄 載入中...';
            startButton.disabled = true;

            try {
                // 載入數據
                console.log('正在載入數據...');
                currentDataset = await loadCSVData(selectedSubject);
                
                if (currentDataset.length === 0) {
                    throw new Error('數據載入失敗或數據為空');
                }

                const selectedDiseaseSet = new Set(selectedDiseases);
                const filteredDataset = currentDataset.filter(row => {
                    const diseaseName = (row['病名'] || '').trim();
                    return selectedDiseaseSet.has(diseaseName);
                });

                if (filteredDataset.length === 0) {
                    throw new Error('病名篩選後沒有可用題目資料，請調整病名分類勾選');
                }

                console.log(`病名篩選後資料量: ${filteredDataset.length}/${currentDataset.length}`);

                if (followUpMode !== 'none') {
                    const followUpReadyDataset = filteredDataset.filter(row =>
                        canGenerateFollowUpForRow(row, filteredDataset, followUpMode)
                    );

                    console.log(`可產生追問的資料量: ${followUpReadyDataset.length}/${filteredDataset.length}`);

                    // 不再阻止啟動測驗：若完全無法追問，這次測驗自動降級為不啟用追問
                    if (followUpReadyDataset.length === 0) {
                        effectiveFollowUpMode = 'none';
                        alert('⚠️ 目前資料暫時無法產生所選追問模式，這次測驗將先以主題作答進行。');
                    }
                }

                currentDataset = filteredDataset;

                console.log('數據載入成功，共', currentDataset.length, '條記錄');

                // 檢查數據中是否包含所需欄位
                const sampleRow = currentDataset[0];
                const missingFields = [];
                
                questionInfo.forEach(field => {
                    if (!(field in sampleRow)) {
                        missingFields.push(field);
                    }
                });
                
                answerInfo.forEach(field => {
                    if (!(field in sampleRow)) {
                        missingFields.push(field);
                    }
                });

                if (missingFields.length > 0) {
                    throw new Error(`數據中缺少必要欄位: ${missingFields.join(', ')}\n\n可用欄位: ${Object.keys(sampleRow).join(', ')}`);
                }

                // 生成題目
                console.log('正在生成題目...');
                
                // 記錄所有可能的病名證型組合
                const allCombinations = new Set();
                currentDataset.forEach(row => {
                    if (row['病名'] && row['證型']) {
                        allCombinations.add(`${row['病名']}_${row['證型']}`);
                    }
                });
                console.log(`🎯 數據集中共有 ${allCombinations.size} 種不同的病名證型組合`);
                
                currentQuestions = generateQuestions(currentDataset, questionInfo, answerInfo, questionCount);
                
                if (currentQuestions.length === 0) {
                    throw new Error('無法生成題目，請檢查數據或調整設定');
                }

                console.log('成功生成', currentQuestions.length, '道題目');

                // 統計本次測驗將包含的病名證型組合
                const testCombinations = new Set();
                currentQuestions.forEach((q, index) => {
                    if (q.data['病名'] && q.data['證型']) {
                        const combo = `${q.data['病名']}_${q.data['證型']}`;
                        testCombinations.add(combo);
                        console.log(`第${index + 1}題: ${combo}`);
                    }
                });
                console.log(`📊 本次測驗包含 ${testCombinations.size} 種不同的病名證型組合`);
                console.log('本次測驗的組合:', Array.from(testCombinations));

                // 初始化測驗狀態
                currentQuestionIndex = 0;
                score = 0;
                totalQuestions = currentQuestions.length;
                questionAnswered = false;
                currentDifficultyMode = difficultyMode;
                currentFollowUpMode = effectiveFollowUpMode;
                pendingFollowUpQuestion = null;
                isShowingFollowUpQuestion = false;
                questionResults = []; // 重置統計數據
                followUpResults = []; // 重置追問統計

                // 切換界面
                document.getElementById('setupSection').style.display = 'none';
                document.getElementById('quizSection').style.display = 'block';

                // 顯示第一題
                showCurrentQuestion();

            } catch (error) {
                console.error('啟動測驗失敗:', error);
                alert('啟動測驗失敗:\n\n' + error.message);
            } finally {
                // 恢復按鈕狀態
                startButton.textContent = originalText;
                startButton.disabled = false;
            }
        }

        // 切換題目文字的展開/縮小狀態
        function toggleQuestionText() {
